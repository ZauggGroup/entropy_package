# Build the pkgdown site and publish it to GitHub Pages.
# anndataR and rhdf5 are Suggests used only in eval=FALSE chunks, and anndataR
# is not on CRAN, so hard dependencies plus BiocStyle are installed instead of
# the full Suggests set. BiocStyle is required: four vignettes use
# BiocStyle::html_document and one calls BiocStyle::pkg_ver() in inline YAML.
on:
  push:
    branches: [master]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            bioc::BiocStyle
            local::.

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
