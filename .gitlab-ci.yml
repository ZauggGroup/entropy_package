image: rocker/verse:4.5.3

pages:
  stage: deploy
  script:
    - R -e "needed <- setdiff(c('BiocManager', 'remotes'), rownames(installed.packages())); if (length(needed)) install.packages(needed)"
    - R -e "BiocManager::install(c('anndataR', 'BiocStyle', 'rhdf5'), dependencies = c('Depends', 'Imports', 'LinkingTo'), ask = FALSE, update = FALSE)"
    - R -e "options(repos = BiocManager::repositories()); remotes::install_deps(dependencies = c('Depends', 'Imports', 'LinkingTo'), upgrade = 'never')"
    - R -e "devtools::test()"
    - R -e "remotes::install_local('.', dependencies = FALSE, upgrade = 'never')"
    - R -e "pkgdown::build_site(new_process = FALSE)"
    - mv docs public
  artifacts:
    paths:
      - public
  only:
    - master
